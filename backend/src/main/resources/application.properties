spring.application.name=backend

# The database comes from the environment; the defaults match docker compose in the repository root.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/todo}
spring.datasource.username=${DB_USER:todo}
spring.datasource.password=${DB_PASSWORD:todo}

# Schema is owned by Flyway migrations under db/migration; Hibernate only validates it.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.port=${PORT:8080}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
