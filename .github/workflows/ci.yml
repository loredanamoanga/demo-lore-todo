name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Spotless, Checkstyle, unit and integration tests, SpotBugs, JaCoCo
        working-directory: backend
        run: ./mvnw -B verify
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 80 percent line coverage on changed backend files
        if: github.event_name == 'pull_request'
        run: node scripts/coverage-changed.mjs "origin/${{ github.base_ref }}" backend/target/site/jacoco/jacoco.xml none
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-reports
          path: |
            backend/target/site/jacoco
            backend/target/surefire-reports
            backend/target/failsafe-reports
            backend/target/spotbugsXml.xml
          if-no-files-found: ignore

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Prettier
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      - name: Vitest with coverage
        run: npm run test:ci
      - name: 80 percent line coverage on changed frontend files
        if: github.event_name == 'pull_request'
        working-directory: .
        run: node scripts/coverage-changed.mjs "origin/${{ github.base_ref }}" none frontend/coverage/frontend/coverage-final.json
      - name: Production build
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: todo
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: todo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todo -d todo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Build and start the backend
        working-directory: backend
        run: |
          ./mvnw -B -q -DskipTests -Dspotless.check.skip=true -Dcheckstyle.skip=true package
          nohup java -jar target/backend-0.0.1-SNAPSHOT.jar > ../backend.log 2>&1 &
      - name: Install and start the frontend
        working-directory: frontend
        run: |
          npm ci
          nohup npx ng serve --host 127.0.0.1 --port 4200 > ../frontend.log 2>&1 &
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Wait for both apps
        run: |
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/actuator/health >/dev/null && curl -sf http://127.0.0.1:4200/ >/dev/null && exit 0
            sleep 2
          done
          echo "the apps did not come up"; tail -50 backend.log frontend.log; exit 1
      - name: Playwright
        working-directory: e2e
        run: npm test
        env:
          E2E_BASE_URL: http://127.0.0.1:4200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    name: trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
